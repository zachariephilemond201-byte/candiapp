services:

   app:
     build: .
     container_name: candiapp-app
     ports:
       - "127.0.0.1:8080:80"
     environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
     depends_on:
        db:
          condition: service_healthy

   db:
     image: postgres:17 
     container_name: candiapp-db
     environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
     volumes:
      - postgres_data:/var/lib/postgresql/data
     healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
       retries: 10


volumes:
  postgres_data:

