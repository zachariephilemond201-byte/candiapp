services:

   app:
     build: .
     container_name: candiapp-app
     ports:
       - "127.0.0.1:8080:80"
     environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_NAME: candiapp
        DB_USER: candiapp_user
        DB_PASSWORD: Surlex74
     depends_on:
        db:
          condition: service_healthy

   db:
     image: postgres:17 
     container_name: candiapp-db
     environment:
       POSTGRES_DB: candiapp
       POSTGRES_USER: candiapp_user
       POSTGRES_PASSWORD: Surlex74
     volumes:
      - postgres_data:/var/lib/postgresql/data
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U candiapp -d candiapp"]
       interval: 5s
       timeout: 5s
       retries: 10


volumes:
  postgres_data:

